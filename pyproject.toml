[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderverse-ai"
version = "0.1.0"
description = "Knowledge Graph and GraphRAG explorer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx==3.6.1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "sentence-transformers==5.7.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]
neo4j = ["neo4j>=5.23,<6"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
